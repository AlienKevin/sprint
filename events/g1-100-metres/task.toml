schema_version = "1.3"

# Harbor also always collects the convention publish dir `/logs/artifacts`
# (host: trial/artifacts/logs/artifacts/). Agent/training telemetry lands there.
# Each sealed verifier writes its separate trusted stream under
# `/logs/verifier/telemetry`, which Harbor downloads with verifier output.

[task]
name = "terminal-bench/g1-100-metres"
description = "Produce a Unitree G1 humanoid policy that runs 100 m as fast as possible in Isaac Lab"
authors = [{ name = "Kevin Li", email = "kevinli020508@gmail.com" }]
keywords = ["robotics", "control", "isaac-lab", "humanoid", "locomotion", "gpu"]

[verifier]
# Current A10G evidence is about two minutes for the nominal three-lane 64 s
# rollout. A valid policy also runs two one-lane held-out trials. The internal
# 12-minute and outer 15-minute ceilings leave more than 2x headroom while
# failing a regression before it can consume an hour-long GPU allocation.
timeout_sec = 900
# Isaac Lab is installed editable at /opt/IsaacLab, so a verifier sharing the
# agent's container would import physics the agent could have edited.
environment_mode = "separate"

# Harbor is the trusted acceptance boundary. Each trial may have one accepted
# policy outstanding and may accept another no sooner than five minutes after
# the previous acceptance. Replaying one request ID is idempotent; a new ID with
# identical bytes is a new submission and is subject to the same limiter.
[verifier.continuous]
enabled = true
watch_dir = "/app/submissions/queue"
results_dir = "/app/submissions/results"
return_results_to_agent = false
drain_pending_on_stop = true
# Every accepted policy is part of the benchmark result set. There is no
# privileged final artifact or separate post-agent verification.
continuous_only = true
max_verifier_attempts = 3
verifier_retry_backoff_sec = 2.0
submission_path = "/app/submission/policy.pt"
poll_interval_sec = 20.0
minimum_submission_interval_sec = 300.0
max_outstanding_submissions = 1
# Every trial feeds one batch-scoped trusted verifier lane. Official results are
# archival benchmark measurements and never return to the agent; the published
# verifier in the training image is the agent's debugging surface. The host
# lease is crash-safe and admits at most one official verifier sandbox at once.
shared_scheduler_lock_path = "$SPRINT_SHARED_STATE_DIR/verifier.lock"
# Replayed bytes under the exact same task/verifier fingerprint reuse the
# checksummed trusted result. A verifier/task change creates a different key.
shared_result_cache_dir = "$SPRINT_SHARED_CACHE_DIR"
#
# Headless Kit cannot initialize Vulkan in Modal's gVisor sandbox, but CUDA
# physics remains active. The verifier rejects PhysX's distinct software-
# fallback warnings rather than treating graphics-path warnings as fallback.
max_concurrent = 1

[verifier.environment]
build_timeout_sec = 5400.0   # Isaac Sim's extension cache alone is about 15 GB
# Historical verifier telemetry (12,462 cgroup-local samples across 37 runs)
# showed p99 CPU below 3.1 Modal physical cores and memory below 8.1 GiB.
# Keep measured headroom without paying the former 8-core/32-GiB floor.
cpus = 4
gpus = 1
gpu_types = ["A10G"]         # the score is a simulated time, so this only
                             # fixes how long verification takes, not the result
memory_mb = 10240
storage_mb = 61440
# Isaac streams every scene asset from NVIDIA's bucket at spawn time and caches
# nothing, so this used to be unscoreable: FileNotFoundError on the robot, then
# on the ground plane. The assets are now mirrored into the verifier image at
# build time and Isaac's asset root points at the mirror, so scoring reaches
# nothing at all and cannot be broken by a bad day on someone else's CDN.
network_mode = "no-network"

[environment]
build_timeout_sec = 5400.0
# The persistent agent runs Codex, shell tools, and orchestration only. Isaac
# executes in separately metered training/verifier GPU sandboxes. Across 36,054
# historical cgroup-local samples, agent p99 CPU stayed below one Modal physical
# core and peak memory stayed below 7.1 GiB, so 2 cores and 8 GiB retain measured
# headroom without paying Isaac-sized
# resources for the full 24-hour agent lifetime.
cpus = 2
# CPU-only agent sandbox: Modal Sandboxes without a GPU requirement are not
# subject to infrastructure preemption. Isaac training runs on a separate A10G
# worker through `event gpu`; checkpoint and recovery semantics are implemented
# by `event_runtime.compute`. The durable launcher
# passes Modal's maximum 86,400-second Sandbox lifetime; the host supervisor
# recreates this CPU sandbox from the same Volume if its process exits early.
# Do NOT use Harbor --override-gpus 0; that would also strip verifier GPUs.
gpus = 0
memory_mb = 8192
storage_mb = 61440
# Start completely offline. The trusted launcher adds exactly one model API
# hostname to the agent phase via Harbor --allow-agent-host. Agent setup stays
# offline because the pinned CLI binaries are baked into the image; package
# installation, arbitrary browsing, Modal APIs, and every other destination
# remain unreachable.
network_mode = "no-network"
