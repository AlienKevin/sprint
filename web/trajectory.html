<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Inspect agent reasoning, messages, tools, observations, timing, and token usage for every Agents' 100m trial.">
  <title>Agents' 100m · Agent trajectory</title>
  <link rel="stylesheet" href="/trajectory.css?v=20260824-17">
</head>
<body>
  <header class="viewer-nav">
    <a class="brand" href="/">Agents' 100m</a>
    <span class="nav-slash">/</span>
    <span>Agent trajectory</span>
  </header>

  <main class="viewer-layout">
    <aside class="viewer-rail left-rail">
      <span id="pulse-dock-sentinel" class="pulse-dock-sentinel" aria-hidden="true"></span>
      <section class="utilization-overview" aria-label="Run resource utilization">
        <header class="utilization-head">
          <div class="run-identity">
            <span class="model-dot"></span>
            <div><strong id="run-model">—</strong></div>
          </div>
          <dl class="pulse-stats" aria-live="polite">
            <div><dt>Elapsed</dt><dd id="summary-duration">—</dd></div>
            <div><dt>Steps</dt><dd id="summary-steps">—</dd></div>
            <div><dt>Tools</dt><dd id="summary-tools">—</dd></div>
            <div><dt>Cost</dt><dd id="summary-cost">—</dd></div>
          </dl>
          <p id="utilization-status" class="sr-only" aria-live="polite">Loading utilization…</p>
        </header>
        <label class="run-picker" hidden><span>Trial</span><select id="run"><option>Loading trajectories…</option></select></label>
        <div id="utilization-stage" class="utilization-stage">
          <canvas id="utilization-chart" height="126" tabindex="0" role="img" aria-label="Agent CPU, training GPU, and tool calls over the run. Hover to preview and click to select the nearest agent step."></canvas>
          <div id="utilization-tip" class="utilization-tip" hidden></div>
        </div>
        <footer class="utilization-footer">
          <span><i class="pulse-dot cpu"></i>CPU</span>
          <span><i class="pulse-dot training"></i>Train GPU</span>
          <span><i class="pulse-dot tools"></i>Tools</span>
        </footer>
      </section>
    </aside>

    <section class="trace-column" aria-label="Agent trace">
      <div class="trajectory-controls">
        <span id="status" class="status">Loading…</span>
        <label class="jump-control"><span class="sr-only">Jump to step</span><input id="jump-step" type="number" min="1" placeholder="step #" inputmode="numeric"></label>
        <label class="search"><span class="sr-only">Search trajectory</span><input id="search" type="search" placeholder="Search trace…" autocomplete="off"></label>
        <button id="expand" class="expand-button" type="button">Expand all</button>
      </div>
      <div id="steps" class="steps" aria-live="polite"></div>
    </section>

  </main>

  <script src="/trajectory.js?v=20260824-10"></script>
  <script src="/trajectory-overview.js?v=20260824-8"></script>
</body>
</html>
