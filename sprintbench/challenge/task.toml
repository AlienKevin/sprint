schema_version = "1.3"

# The only thing that crosses from the agent to the verifier. Everything the
# score depends on, the robot, the physics, the course, the scoring and the
# held-out seeds, is rebuilt inside the verifier image from sources the agent
# never had access to.
artifacts = ["/app/submission/policy.pt"]

[task]
name = "terminal-bench/g1-sprint-100m"
description = "Train a Unitree G1 humanoid policy that runs 100 m as fast as possible in Isaac Lab"
authors = [{ name = "Kevin Li", email = "kevinli020508@gmail.com" }]
keywords = ["robotics", "reinforcement-learning", "isaac-lab", "humanoid", "locomotion", "gpu"]

[verifier]
# Six rollouts of 3,000 control steps, plus an environment build apiece and one
# Isaac Sim start, is about twelve minutes on one A10. The rest is headroom.
timeout_sec = 3600
# Isaac Lab is installed editable at /opt/IsaacLab, so a verifier sharing the
# agent's container would import physics the agent could have edited.
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 5400.0   # Isaac Sim's extension cache alone is about 15 GB
cpus = 8
gpus = 1
memory_mb = 32768
storage_mb = 61440
network_mode = "none"        # scoring fetches nothing

[agent]
timeout_sec = 86400          # training a locomotion policy from scratch

[environment]
build_timeout_sec = 5400.0
cpus = 8
gpus = 1
memory_mb = 32768
storage_mb = 61440
network_mode = "public"      # training may pull whatever it needs
